name: toolcab
description: "ToolCab - All-in-One AI Productivity Toolkit"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  get: ^4.6.6
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Local Storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Permissions & Sharing
  permission_handler: ^11.3.1
  share_plus: ^12.0.2

  # Speech
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2

  # Links
  url_launcher: ^6.2.6

  # ML Kit
  google_ml_kit: ^0.18.0

  # Image Picker
  image_picker: ^1.1.2

  # File Picker
  file_picker: ^8.0.0

  # PDF Generation & Parsing
  pdf: ^3.11.1
  pdfx: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/